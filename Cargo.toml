[package]
name = "autodok"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
base64 = "0.22.1"
bollard = "0.20.1"
ctrlc = { version = "3.5.2", features = ["termination"] }
dotenv = "0.15.0"
futures = "0.3.32"
futures-core = "0.3.32"
futures-util = "0.3.32"
lazy_static = "1.5.0"
log = "0.4.29"
rand = "0.10.0"
serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
