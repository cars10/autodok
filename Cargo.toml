[package]
name = "autodok"
version = "0.1.0"
edition = "2021"

[lib]
name = "autodok"
path = "src/lib.rs"

[[bin]]
name = "autodok"
path = "src/main.rs"

[dependencies]
axum = "0.7.7"
tokio = { version = "1.0", features = ["full"] }
serde = "1.0"
serde_json = "1.0"
bollard = { version = "0.17", features= ["ssl"] }
futures = "0.3.31"
futures-core = "0.3.31"
futures-util = "0.3.31"
log = "0.4"
ctrlc = { version = "3.4", features = ["termination"] }
rand = "0.8"
lazy_static = "1.5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing = "0.1"
tower-http = { version = "0.6", features = ["trace"] }
base64 = "0.22"
chrono = "0.4.38"
tar = "0.4.43"
bytes = "1.9.0"
reqwest = { version = "0.12", default-features = false, features = ["http2", "json"] }
